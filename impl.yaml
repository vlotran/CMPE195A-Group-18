project_name: "Smart Hydroponic Garden System"
project_type: "iot"            # web | mobile | api | ml | hardware | iot | embedded | hybrid

impl_claim: >-
  Every 30 seconds, the backend stores sensor readings and checks them against
  each signed-in user's active profile; confirmed danger readings create an
  account-specific alert shown on that user's dashboard. Signed-in users can
  manually control the fan, humidifier, and grow light and set a daily
  grow-light schedule. With GPIO enabled on the Pi, automatic control
  independently switches the fan and humidifier at the active profile's
  temperature and humidity limits, preserving each output's state inside its
  profile range to provide hysteresis.

languages: ["python", "javascript"]
hardware_required: true         # live sensors, camera and relays need the Raspberry Pi 5

setup:
  - "pip install -r requirements.txt"
  - "cp .env.example .env"
  - "cd frontend && npm ci && cp .env.example .env"
build:
  - "cd frontend && npm run build"
test:
  - "python -m pytest tests -v"
  - "cd frontend && npm run lint"
run:
  - "python -m backend.src.main"
  # For live Pi data, set frontend/.env VITE_API_BASE_URL to the Pi backend URL instead.
  - "cd frontend && npm run dev"

mock_mode:
  available: true
  commands:
    # Terminal 1, from the repo root: backend with simulated BME280, BME680 and pH sensors
    - "USE_MOCK_SENSORS=True python -m backend.src.main"
    # Terminal 2: frontend pointed at the local backend
    - "cd frontend && VITE_API_BASE_URL=http://localhost:8000 npm run dev"

demo:
  video: "https://www.youtube.com/watch?v=x4Ds_oYojNE"
  screenshots:
    - "docs/screenshots/Dashboard.png"
    - "docs/screenshots/Settings.png"
    - "docs/system-architecture/architecture.png"
    - "docs/system-architecture/deployment-pipeline.png"

notes: >-
  The live run depends on the team's Raspberry Pi 5 being powered on and online through ngrok;
  if it is offline, the dashboard shows "System Error", so use mock_mode instead.
  Accounts are stored per database: create a new account on whichever backend you use.
  To check the claim in mock_mode: sign in, open Settings, edit the active profile's
  temperature range to 90-95 C and save. Within about 75 s a temperature Danger popup
  appears without refreshing (refresh to see the card turn red); a second account with
  the default profile gets no alert.
  Live readings: BME280 and BME680 on the Pi; the pH sensor still uses simulated data.
  Peristaltic pumps for pH and nutrient dosing, and water EC and water-level sensors, are planned additions
  and are not part of the current implementation.
  The camera needs the Arducam V3 and shows "unavailable" in mock mode. Manual controls
  and the grow-light schedule require ACTUATOR_HARDWARE_ENABLED=True in the Pi repo-root
  .env; it defaults to false. Automatic fan/humidifier control requires real sensors and
  GPIO enabled, uses the signed-in user's active profile, and enforces a 30-second
  minimum between ordinary relay changes. Missing or invalid sensor readings turn both
  automatic outputs off. Relay map: fan on GPIO16/SSR CH1, humidifier on GPIO20/mechanical
  IN2, and grow light on GPIO21/mechanical IN1; GPIO12/SSR CH2 is unused. Verify wiring
  and loads before enabling physical outputs. Mock mode can test the dashboard, APIs,
  profile/alert behavior, and controller logic, but cannot operate or verify real relays.
  Backend tests (75) need no hardware and also run in GitHub Actions on every push.
  The mock_mode commands use bash syntax; on Windows PowerShell, set USE_MOCK_SENSORS=True
  in .env and VITE_API_BASE_URL=http://localhost:8000 in frontend/.env instead.
