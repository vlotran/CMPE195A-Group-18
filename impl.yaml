project_name: "Smart Hydroponic Garden System"
project_type: "iot"            # web | mobile | api | ml | hardware | iot | embedded | hybrid

impl_claim: "A BME280/BME680 reading taken by the Raspberry Pi appears on the signed-in user's dashboard within 35 seconds (30 s read interval + 5 s polling). When two consecutive readings fall outside the danger band of that user's active threshold profile, a Danger alert is saved for that user only and shown as a dashboard popup within 75 seconds; other accounts, with their own profiles, do not get it."

languages: ["python", "javascript"]
hardware_required: true         # live sensors, camera and relays need the Raspberry Pi 5

setup:
  - "pip install -r requirements.txt"
  - "cp .env.example .env"
  - "cd frontend && npm ci && cp .env.example .env"
build:
  - "cd frontend && npm run build"
test:
  - "python -m pytest tests -v"
  - "cd frontend && npm run lint"
run:
  # Live data from the team's Raspberry Pi: frontend/.env points to the Pi's ngrok URL,
  # so only the frontend runs locally. Open http://localhost:5173 and create an account.
  - "cd frontend && npm run dev"

mock_mode:
  available: true
  commands:
    # Terminal 1, from the repo root: backend with simulated BME280, BME680 and pH sensors
    - "USE_MOCK_SENSORS=True python -m backend.src.main"
    # Terminal 2: frontend pointed at the local backend
    - "cd frontend && VITE_API_BASE_URL=http://localhost:8000 npm run dev"

demo:
  video: "TODO: add prototype demo video link"
  screenshots:
    - "docs/screenshots/Dashboard.png"
    - "docs/screenshots/Settings.png"
    - "docs/system-architecture/architecture.png"
    - "docs/system-architecture/deployment-pipeline.png"

notes: >-
  The live run depends on the team's Raspberry Pi 5 being powered on and online through ngrok;
  if it is offline, the dashboard shows "System Error", so use mock_mode instead.
  Accounts are stored per database: create a new account on whichever backend you use.
  To check the claim in mock_mode: sign in, open Settings, edit the active profile's
  temperature range to 90-95 C and save. Within about 75 s a temperature Danger popup
  appears without refreshing (refresh to see the card turn red); a second account with
  the default profile gets no alert.
  Live readings: BME280 and BME680 on the Pi; the pH sensor still uses simulated data.
  The live camera needs the Pi camera (Picamera2) and shows "unavailable" in mock mode. (change later)
  The 4 relay-controlled outlets (light, humidifier, exhaust fan, water pump) are planned
  and not implemented in software yet. The system is open loop: it never switches
  anything on its own.
  The mock_mode commands use bash syntax; on Windows PowerShell, set USE_MOCK_SENSORS=True
  in .env and VITE_API_BASE_URL=http://localhost:8000 in frontend/.env instead.
  Backend tests (49) need no hardware and also run in GitHub Actions on every push.
